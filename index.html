<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ソフトボール成績帳</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#17241d;--grass:#1b5e3b;--chalk:#eef2ee;--line:#c9d3cb;--ball:#e6dc2e;--mute:#62716a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;background:var(--chalk);color:var(--ink);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--grass);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;font-weight:900;letter-spacing:.04em}
#tid{background:var(--ball);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}
#top{position:sticky;top:0;z-index:5}
#gear{background:none;border:0;color:#fff;font-size:22px;padding:0 6px;line-height:1}
main{padding:12px;max-width:760px;margin:0 auto}
nav{display:flex;background:var(--ink)}
nav button{flex:1;background:none;border:0;color:#b9c7be;font:700 14px inherit;font-family:inherit;padding:14px 0}
nav button.on{color:var(--ball);box-shadow:inset 0 -3px var(--ball)}
h2{font-size:17px;margin:18px 0 8px;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:90px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
select:disabled{opacity:.35}
button.b{background:var(--grass);color:#fff;border:0;border-radius:6px;padding:11px 14px;font:700 15px inherit;font-family:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit}
button.x{background:none;border:0;color:#a33;font-size:16px;padding:4px 8px}
.gm{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.gm small,.mute{color:var(--mute)}
.sc{font-weight:900;font-size:18px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:6px;font:700 14px inherit;font-family:inherit}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
th{background:#e3ebe5;font-weight:700}
td.l,th.l{text-align:left}
tr.t td{font-weight:900;background:#f4f7f4}
.sc td input{padding:4px 0;text-align:center;min-width:30px;border-radius:3px}
.chip{display:inline-block;margin:1px;padding:0 5px;border-radius:3px;background:#edf1ee}
.chip.h{background:var(--ball);font-weight:700}
.pa{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.note{font-size:13px;color:var(--mute)}
.sc td.a input{background:#fff3b0}
.pa.sb{padding-left:16px;background:#f6f9f6}
.chip.r{background:#d9e8f5}
.nf{display:flex;flex-direction:column;font-size:12px;color:var(--mute);flex:1;min-width:64px}
.nf input{width:100%}
.chip.ed{outline:1px dashed #6a8;cursor:pointer}
.chip.add{background:#fff;border:1px solid #6a8;cursor:pointer}
</style></head><body>
<div id="top"><header><b id="ttl"></b><button id="gear" data-a="tab" data-id="settings" aria-label="設定" hidden>⚙</button></header>
<nav id="nv" hidden><button data-a="tab" data-id="games">試合</button><button data-a="tab" data-id="stats">集計</button></nav></div>
<main id="m"></main>
<script src="config.js"></script>
<script>
/* ===== Firebase設定は config.js に書きます(このファイルは編集不要)。空だとこの端末だけで動作します ===== */
const FB=window.FB_CONFIG||{apiKey:"",authDomain:"",projectId:"",appId:""};
/* ============================================================================== */
const cloud=!!FB.projectId;let fdb;
if(cloud){firebase.initializeApp(FB);fdb=firebase.firestore()}
const LS=localStorage,$=s=>document.querySelector(s);
const col=(t,c)=>fdb.collection('teams').doc(t).collection(c);
function sub(t,c,cb){
 if(cloud)return col(t,c).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))));
 const k='sb:'+t+':'+c,f=()=>cb(Object.values(JSON.parse(LS[k]||'{}'))),h=e=>{if(e.detail===k)f()};
 addEventListener('sbchg',h);f();return()=>removeEventListener('sbchg',h)}
function put(c,o){
 if(cloud)return col(S.team,c).doc(o.id).set(o);
 const k='sb:'+S.team+':'+c,m=JSON.parse(LS[k]||'{}');m[o.id]=o;LS[k]=JSON.stringify(m);dispatchEvent(new CustomEvent('sbchg',{detail:k}))}
function del(c,id){
 if(cloud)return col(S.team,c).doc(id).delete();
 const k='sb:'+S.team+':'+c,m=JSON.parse(LS[k]||'{}');delete m[id];LS[k]=JSON.stringify(m);dispatchEvent(new CustomEvent('sbchg',{detail:k}))}

const DIRS=['投','捕','一','二','三','遊','左','中','右'],FPOS=DIRS,KINDS=['ゴロ','ライナー','フライ'],KS={ゴロ:'ゴ',ライナー:'直',フライ:'飛'};
const RES=[['単','安打(単打)'],['二','長打(二塁打)'],['三','長打(三塁打)'],['本','長打(本塁打)'],['失','エラー'],['out','アウト'],['進','アウト(進塁打)'],['犠打','アウト(犠打)'],['犠飛','アウト(犠飛)'],['四','四球'],['死','死球'],['振','三振(アウト)'],['振逃','三振(振り逃げ)'],['野選','野選(フィールダースチョイス)']];
const REACH=['単','二','三','本','失','野選','四','死','振逃'];
const NOBALL=['四','死','振','振逃'];
const isOut=r=>['out','進','犠打','犠飛','振'].includes(r);
const RK=[['得点','得点'],['盗塁','盗塁'],['盗塁死','盗塁死(アウト)'],['走塁死','走塁死(アウト)'],['暴投','進塁(暴投)'],['捕逸','進塁(捕逸)']],RS={得点:'得',盗塁:'盗',盗塁死:'盗死',走塁死:'走死',暴投:'暴',捕逸:'捕'},RLAB={得点:'得点',盗塁:'盗塁',盗塁死:'盗塁死',走塁死:'走塁死',暴投:'進塁(暴投)',捕逸:'進塁(捕逸)'};
const short=t=>[...String(t||'')].slice(0,3).join('');
const POS=[['','守備'],...DIRS,'DP',['代','代打'],'控'];
const S={team:LS.team||'',meta:[],players:[],games:[],pas:[],runs:[],pitch:[],pedit:false,pre:null,pe:null,scSel:[],tab:'games',gid:null,sub:'in',inn:1,edit:null,f:{season:'',tourn:'',type:''}};
let unsubs=[];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(a,sel)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}"${v==sel?' selected':''}>${esc(l)}</option>`}).join('');
const sum=a=>(a||[]).reduce((x,y)=>x+(+y||0),0);
const tname=()=>(S.meta.find(m=>m.id==='team')||{}).name||'';
const pn=id=>(S.players.find(p=>p.id===id)||{name:'(削除済)'}).name;
const fmt=x=>x.toFixed(3).replace(/^0/,'');
const today=()=>new Date().toISOString().slice(0,10);
function join(t){unsubs.forEach(u=>u());S.team=t;LS.team=t;S.meta=[];S.players=[];S.games=[];S.pas=[];S.runs=[];S.pitch=[];
 unsubs=['meta','players','games','pas','runs','pitch'].map(c=>sub(t,c,a=>{S[c]=a;draw()}));draw()}

/* ---- スコア(未入力=null)と自動加算 ---- */
const ent=v=>v!=null&&v!=='';
const nrm=a=>Array.from({length:9},(_,i)=>a&&ent(a[i])?+a[i]:null);
const au9=g=>Array.from({length:9},(_,i)=>!!(g.auto&&g.auto[i]));
const maxInn=g=>{let m=0;nrm(g.sc&&g.sc.us).forEach((v,i)=>{if(v!=null)m=i+1});return m};
const outsIn=(g,inn,ex)=>S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex&&isOut(p.r)).length+S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&(r.k==='盗塁死'||r.k==='走塁死')).length;
const maxThem=g=>{let m=0;nrm(g.sc&&g.sc.them).forEach((v,i)=>{if(v!=null)m=i+1});return m};
const at9=g=>Array.from({length:9},(_,i)=>!!(g.autoT&&g.autoT[i]));
const pOuts=(g,inn,ex)=>sum(S.pitch.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.o));
const pRuns=(g,inn,ex)=>sum(S.pitch.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.r));
function autoThem(g,inn,list){const th=nrm(g.sc&&g.sc.them),us=nrm(g.sc&&g.sc.us),at=at9(g),i=inn-1;
 if(!(ent(th[i])&&!at[i])){const s=sum(list.filter(p=>+p.inn===+inn).map(p=>p.r));if(s>0){th[i]=s;at[i]=true}else if(at[i]){th[i]=null;at[i]=false}}
 return{...g,sc:{us,them:th},autoT:at}}
const pst=a=>{const o={o:0,h:0,hr:0,bb:0,hbp:0,so:0,r:0,er:0};a.forEach(x=>{for(const k in o)o[k]+=+x[k]||0});return o};
const ipS=o=>{const i=Math.floor(o/3),r=o%3;return r?(i?i+' ':'')+r+'/3':String(i)};
function onBase(g,inn,o){o=o||{};const c={},tb=o.tb==null?Infinity:o.tb;
 S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&REACH.includes(p.r)&&p.id!==o.ex&&p.t<tb).forEach(p=>{c[p.pid]=(c[p.pid]||0)+1});
 S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&['得点','盗塁死','走塁死'].includes(r.k)&&r.pa!==o.ex&&r.t<tb).forEach(r=>{c[r.pid]=(c[r.pid]||0)-1});
 return c}
const runsIn=(g,inn)=>S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&r.k==='得点').length;
const rbiIn=(g,inn,ex)=>sum(S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.rbi));
function autoApply(g,inn,pas,runs){const us=nrm(g.sc&&g.sc.us),th=nrm(g.sc&&g.sc.them),au=au9(g),i=inn-1;
 if(!(ent(us[i])&&!au[i])){const s=Math.max(sum(pas.filter(p=>+p.inn===+inn).map(p=>p.rbi)),(runs||[]).filter(r=>r.k==='得点'&&+r.inn===+inn).length);
  if(s>0){us[i]=s;au[i]=true}else if(au[i]){us[i]=null;au[i]=false}}
 return{...g,sc:{us,them:th},auto:au}}

/* ---- 打順スロット(代打・守備交代・DP/FP) ---- */
const subsOf=p=>[...(p.sub||'')].filter(c=>FPOS.includes(c));
const slotsOf=g=>g.slots||(g.lineup||[]).map((id,i)=>{const o=(g.pos||{})[id]||'';return{id:'s'+i,pid:id,pos:o==='DH'?'DP':o==='EP'?'':o,fp:'',fpPos:'',log:[]}});
const cp=L=>L.map(s=>({...s,log:[...(s.log||[])]}));
const saveSlots=(g,slots)=>{const{lineup,pos,...r}=g;return put('games',{...r,slots})};
const slotPids=s=>[...new Set([(s.log&&s.log.length)?s.log[0].from:s.pid,...(s.log||[]).map(l=>l.to)])];
function autoPos(p,L){const tk=new Set();L.forEach(s=>{if(s.pos)tk.add(s.pos);if(s.fpPos)tk.add(s.fpPos)});
 return[p.pos,...subsOf(p)].filter(Boolean).find(x=>!tk.has(x))||''}
function prevIds(g){let o=S.games.filter(x=>x.id!==g.id&&slotsOf(x).length);
 const b=o.filter(x=>(x.date||'')<=(g.date||''));if(b.length)o=b;
 o.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!o.length)return[];
 return slotsOf(o[0]).flatMap(s=>[slotPids(s)[0],s.fp].filter(Boolean))}

const lab=p=>{const r=p.r,d=p.d||'',k=KS[p.k]||'';
 if(r==='四')return'四球';if(r==='死')return'死球';if(r==='振')return'三振';if(r==='振逃')return'振逃';if(r==='野選')return d+'野選';
 if(r==='単')return d+'安';if(r==='二')return d+'二';if(r==='三')return d+'三';if(r==='本')return d+'本';
 if(r==='失')return d+k+'失';if(r==='犠打')return d+'犠打';if(r==='犠飛')return d+'犠飛';if(r==='進')return d+k+'進';return d+k};
const isHit=r=>'単二三本'.includes(r)&&r.length===1;
function st(ps){const o={pa:ps.length,ab:0,h:0,b:0,hr:0,bb:0,hbp:0,sf:0,rbi:0,so:0};
 for(const p of ps){o.rbi+=+p.rbi||0;const r=p.r;
  if(r==='四')o.bb++;else if(r==='死')o.hbp++;else if(r==='犠打');else if(r==='犠飛')o.sf++;
  else{o.ab++;if(isHit(r)){o.h++;o.b+={単:1,二:2,三:3,本:4}[r];if(r==='本')o.hr++}}
  if(r==='振'||r==='振逃')o.so++}
 o.avg=o.ab?o.h/o.ab:0;const d=o.ab+o.bb+o.hbp+o.sf;o.obp=d?(o.h+o.bb+o.hbp)/d:0;o.slg=o.ab?o.b/o.ab:0;o.ops=o.obp+o.slg;return o}

function loginV(){return`<div class="card"><h2 style="margin-top:0">チームIDを入力</h2>
<p class="note">同じチームIDを入力した人どうしで成績が共有されます。IDは推測されにくい文字列にしてください(例: tigers-8k3q)。${cloud?'':'<br><b>※現在は共有設定前のため、この端末内だけに保存されます。</b>'}</p>
<div class="row"><input id="tin" placeholder="チームID" autocapitalize="off"><button class="b" data-a="join">開く</button></div></div>`}

function gamesV(){
 const gs=[...S.games].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 return`<h2 style="margin-top:0">試合を作成</h2><div class="card">
<div class="row"><input type="date" id="gd" value="${today()}"><input id="go" placeholder="対戦相手"></div>
<div class="row" style="margin-top:8px"><select id="gt">${opt([['official','公式戦'],['practice','練習試合']])}</select><input id="gn" placeholder="大会名(任意)"></div>
<button class="b" style="margin-top:8px;width:100%" data-a="newgame">試合を作成</button></div>
<h2>試合一覧</h2>`+(gs.length?gs.map(g=>`<div class="card gm" data-a="open" data-id="${g.id}"><div><b>${esc(g.date)} vs ${esc(g.opp||'相手')}</b><br><small>${g.type==='official'?'公式戦':'練習試合'}${g.tourn?' / '+esc(g.tourn):''}</small></div><div class="sc">${sum(g.sc&&g.sc.us)}-${sum(g.sc&&g.sc.them)}</div></div>`).join(''):'<div class="empty">試合がまだありません。上のフォームから作成してください。</div>')}

function settingsV(){return`<h2 style="margin-top:0">チームマスタ</h2><div class="card"><div class="row"><input id="tnm" placeholder="チーム名" value="${esc(tname())}"><button class="b" data-a="savet" style="flex:0 0 auto">保存</button></div><p class="note" style="margin:8px 0 0">チームID: <b>${esc(S.team)}</b>(メンバーに共有するのはこのIDです)</p></div>`+playersV()+`<button class="g" style="width:100%;margin-top:14px" data-a="chteam">チームIDを切り替える</button>`}
function playersV(){
 return`<h2>選手マスタ</h2><div class="card"><div class="row"><input id="pnm" placeholder="名前"><input id="pno" placeholder="背番号" inputmode="numeric"></div>
<div class="row" style="margin-top:8px"><select id="ppos">${opt([['','メインポジション'],...DIRS,'DP'])}</select><input id="psub" placeholder="サブポジ(例: 二・三)"><button class="b" data-a="addp" style="flex:0 0 auto">追加</button></div></div>
<h2>登録済みの選手</h2>`+(S.players.length?`<div class="card">${[...S.players].sort((a,b)=>(+a.no||999)-(+b.no||999)).map(p=>`<div class="pa"><span>${esc(p.no)} ${esc(p.name)} <small class="mute">${p.pos?esc(p.pos):''}${subsOf(p).length?' / '+esc(subsOf(p).join('・')):''}</small></span><span><button class="g" data-a="editp" data-id="${p.id}">✎</button><button class="x" data-a="delp" data-id="${p.id}">✕</button></span></div>`).join('')}</div>`:'<div class="empty">選手を追加すると、打順に選べるようになります。</div>')}

const logTxt=l=>`${l.inn}回 ${l.n}番 ${l.k} ${pn(l.from)}→${pn(l.to)}${l.pos?'('+l.pos+')':''}`;

function gameV(){
 const g=S.games.find(x=>x.id===S.gid);if(!g){S.gid=null;return gamesV()}
 const L=slotsOf(g),P=S.pas.filter(p=>p.gid===g.id).sort((a,b)=>a.t-b.t),slOf=p=>p.sl||(L.find(s=>slotPids(s).includes(p.pid))||{}).id;
 const us=nrm(g.sc&&g.sc.us),th=nrm(g.sc&&g.sc.them),au=au9(g);
 const R=S.runs.filter(r=>r.gid===g.id).sort((a,b)=>a.t-b.t),rn0=k=>R.filter(r=>r.k===k).length,rn=(pid,k)=>R.filter(r=>r.pid===pid&&r.k===k).length;
 const logs=L.flatMap((s,i)=>(s.log||[]).map(l=>({...l,n:i+1}))).sort((a,b)=>a.inn-b.inn);
 let h=`<div class="row" style="margin-bottom:6px"><button class="g" data-a="back" style="flex:0 0 auto">← 一覧</button><b style="flex:1">${esc(g.date)} vs ${esc(g.opp||'相手')}</b><button class="g" data-a="editg" style="flex:0 0 auto">✎ 試合情報</button></div>
<div class="tabs">${[['in','入力'],['paper','成績'],['book','スコアブック'],['pit','投手']].map(([k,l])=>`<button data-a="sub" data-id="${k}" class="${S.sub===k?'on':''}">${l}</button>`).join('')}</div>`;
 if(S.sub==='in'){
  const I9=[1,2,3,4,5,6,7,8,9];
  h+=`<div class="sw card"><table class="sc"><tr><th></th>${I9.map(i=>`<th>${i}</th>`).join('')}<th>計</th></tr>
<tr><th>${esc(short(tname())||'自')}</th>${us.map((v,i)=>`<td class="${au[i]?'a':''}"><input type="number" min="0" inputmode="numeric" data-sc="us" data-i="${i}" value="${v??''}"></td>`).join('')}<td><b>${sum(us)}</b></td></tr>
<tr><th>${esc(short(g.opp)||'相手')}</th>${th.map((v,i)=>`<td><input type="number" min="0" inputmode="numeric" data-sc="them" data-i="${i}" value="${v??''}"></td>`).join('')}<td><b>${sum(th)}</b></td></tr></table>
<div class="note" style="margin-top:6px">先に得点を入力してください(0点も入力)。入力した回までの打席を記録でき、打点はその回の得点を超えられません。得点が未入力の回に打点を記録すると、自動で加算されます(黄色)。</div></div>`;

  /* 打順 */
  const inUse=new Set();L.forEach(s=>{inUse.add(s.pid);if(s.fp)inUse.add(s.fp)});
  const free=S.players.filter(p=>!inUse.has(p.id)),pv=prevIds(g);
  const av=[...free].sort((a,b)=>{const x=pv.indexOf(a.id),y=pv.indexOf(b.id);return(x<0?999:x)-(y<0?999:y)||(+a.no||999)-(+b.no||999)});
  const cnt={};L.forEach(s=>{if(FPOS.includes(s.pos)||s.pos==='DP')cnt[s.pos]=(cnt[s.pos]||0)+1;if(s.fp&&s.fpPos)cnt[s.fpPos]=(cnt[s.fpPos]||0)+1});
  const dup=Object.keys(cnt).filter(k=>cnt[k]>1);
  h+=`<h2>打順</h2><div class="card">`+(L.length?L.map((s,i)=>{
