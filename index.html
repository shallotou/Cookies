<style>
:root{--ink:#17241d;--grass:#1b5e3b;--chalk:#eef2ee;--line:#c9d3cb;--ball:#e6dc2e;--mute:#62716a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;background:var(--chalk);color:var(--ink);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--grass);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;font-weight:900;letter-spacing:.04em}
#tid{background:var(--ball);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}
#top{position:sticky;top:0;z-index:5}
#gear{background:none;border:0;color:#fff;font-size:22px;padding:0 6px;line-height:1}

nav button.on{color:var(--ball);box-shadow:inset 0 -3px var(--ball)}
h2{font-size:17px;margin:18px 0 8px;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:90px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
select:disabled{opacity:.35}
button.b{background:var(--grass);color:#fff;border:0;border-radius:6px;padding:11px 14px;font:700 15px inherit;font-family:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit}
button.x{background:none;border:0;color:#a33;font-size:16px;padding:4px 8px}
.gm{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.gm small,.mute{color:var(--mute)}
.sc{font-weight:900;font-size:18px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:6px;font:700 14px inherit;font-family:inherit}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
th{background:#e3ebe5;font-weight:700}
td.l,th.l{text-align:left}
tr.t td{font-weight:900;background:#f4f7f4}
.sc td input{padding:4px 0;text-align:center;min-width:30px;border-radius:3px}
.chip{display:inline-block;margin:1px;padding:0 5px;border-radius:3px;background:#edf1ee}
.chip.h{background:var(--ball);font-weight:700}
.pa{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.note{font-size:13px;color:var(--mute)}
.sc td.a input{background:#fff3b0}
.pa.sb{padding-left:16px;background:#f6f9f6}
.chip.r{background:#d9e8f5}
.nf{display:flex;flex-direction:column;font-size:12px;color:var(--mute);flex:1;min-width:64px}
.nf input{width:100%}
.chip.ed{outline:1px dashed #6a8;cursor:pointer}
.chip.add{background:#fff;border:1px solid #6a8;cursor:pointer}
#upd{background:#1565c0;color:#fff;font-size:14px;font-weight:700;padding:10px 12px;text-align:center;cursor:pointer}
#off{background:#b55a00;color:#fff;font-size:13px;padding:6px 12px;text-align:center}
.ar{display:flex;gap:6px;align-items:center;margin-top:8px}
.ab{flex:1;min-width:0;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font:700 14px inherit;font-family:inherit;color:var(--ink)}
.ab.sm{flex:0 0 44px;padding:6px 0}
.ab.on.y{background:#2e7d32;color:#fff;border-color:#2e7d32}
.ab.on.m{background:#e09b00;color:#fff;border-color:#e09b00}
.bk td.bc{padding:2px;min-width:66px;text-align:center;vertical-align:middle}
.card summary{font-weight:700;cursor:pointer}
.ab.on.n{background:#c62828;color:#fff;border-color:#c62828}

<script>
/* ===== Firebase設定は config.js に書きます(このファイルは編集不要)。空だとこの端末だけで動作します ===== */
const FB=window.FB_CONFIG||{apiKey:"",authDomain:"",projectId:"",appId:""};
/* ============================================================================== */
const cloud=!!FB.projectId;let fdb;
if(cloud){firebase.initializeApp(FB);fdb=firebase.firestore();try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
const LS=localStorage,$=s=>document.querySelector(s);
const col=(t,c)=>fdb.collection('teams').doc(t).collection(c);
function sub(t,c,cb){
 if(cloud)return col(t,c).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>onErr(e));
 const k='sb:'+t+':'+c,f=()=>cb(Object.values(JSON.parse(LS[k]||'{}'))),h=e=>{if(e.detail===k)f()};
 addEventListener('sbchg',h);f();return()=>removeEventListener('sbchg',h)}
function put(c,o){
 if(cloud)return col(S.team,c).doc(o.id).set(o);
 const k='sb:'+S.team+':'+c,m=JSON.parse(LS[k]||'{}');m[o.id]=o;LS[k]=JSON.stringify(m);dispatchEvent(new CustomEvent('sbchg',{detail:k}))}
function del(c,id){
 if(cloud)return col(S.team,c).doc(id).delete();
 const k='sb:'+S.team+':'+c,m=JSON.parse(LS[k]||'{}');delete m[id];LS[k]=JSON.stringify(m);dispatchEvent(new CustomEvent('sbchg',{detail:k}))}

function onErr(e){if(e&&e.code==='permission-denied'&&S.team){delete LS['mem:'+S.team+':'+S.uid];unsubs.forEach(u=>u());unsubs=[];S.team='';S.me=null;S.msg='このチームの閲覧権限がありません。合言葉を入力してください';draw()}}
const DIRS=['投','捕','一','二','三','遊','左','中','右'],FPOS=DIRS,KINDS=['ゴロ','ライナー','フライ'],KS={ゴロ:'ゴ',ライナー:'直',フライ:'飛'};
const RES=[['単','安打(単打)'],['二','長打(二塁打)'],['三','長打(三塁打)'],['本','長打(本塁打)'],['失','エラー'],['out','アウト'],['進','アウト(進塁打)'],['犠打','アウト(犠打)'],['犠飛','アウト(犠飛)'],['併殺','アウト(併殺打・2アウト)'],['四','四球'],['死','死球'],['振','三振(アウト)'],['振逃','三振(振り逃げ)'],['野選','野選(フィールダースチョイス)']];
const REACH=['単','二','三','本','失','野選','四','死','振逃'];
const NOBALL=['四','死','振','振逃'];
const isOut=r=>['out','進','犠打','犠飛','振','併殺'].includes(r);
const outN=r=>r==='併殺'?2:isOut(r)?1:0;
const RK=[['得点','得点'],['盗塁','盗塁'],['盗塁死','盗塁死(アウト)'],['走塁死','走塁死(アウト)'],['暴投','進塁(暴投)'],['捕逸','進塁(捕逸)']],RS={併殺走者:'併',得点:'得',盗塁:'盗',盗塁死:'盗死',走塁死:'走死',暴投:'暴',捕逸:'捕'},RLAB={併殺走者:'併殺(走者アウト)',得点:'得点',盗塁:'盗塁',盗塁死:'盗塁死',走塁死:'走塁死',暴投:'進塁(暴投)',捕逸:'進塁(捕逸)'};
const short=t=>[...String(t||'')].slice(0,3).join('');
const POS=[['','守備'],...DIRS,'DP','DH',['代','代打'],'控'];
const S={team:LS.team||'',uid:'',me:null,ready:!cloud,msg:'',lmode:'join',guideOpen:false,bk:'news',dpSel:'',got:{},linkFail:'',meta:[],players:[],games:[],pas:[],runs:[],pitch:[],pedit:false,pre:null,pe:null,scSel:[],events:[],att:[],evForm:null,evOpen:null,showPast:false,appName:'',tab:'sched',gid:null,sub:'in',inn:1,edit:null,f:{season:'',tourn:'',type:''}};
let unsubs=[];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(a,sel)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}"${v==sel?' selected':''}>${esc(l)}</option>`}).join('');
const sum=a=>(a||[]).reduce((x,y)=>x+(+y||0),0);
const tname=()=>(S.meta.find(m=>m.id==='team')||{}).name||'';
const teamM=()=>S.meta.find(m=>m.id==='team')||{};
const sportV=()=>teamM().sport||'soft';
const eraN=()=>+teamM().inn||(teamM().sport==='base'?9:7);
const rolesOn=()=>!!teamM().roles;
const myPlayer=()=>S.players.find(p=>S.me&&p.id===S.me.playerId);
const isAdmin=()=>{if(!cloud)return true;if(!(S.got.meta&&S.got.players))return false;return !rolesOn()||!!(S.me&&S.me.owner)||!!(myPlayer()&&myPlayer().level==='admin')};
const ADMIN_ACTS=new Set(['newgame','addp','delp','editp','savet','addl','rml','up','dosub','setfp','clrfp','relfp','addpa','delpa','editpa','canpa','addrun','delrun','addpit','editpit','delpit','canpit','editg','delg','evnew','evedit','evcancel','evsave','evdel','evcopy','pedit','addfor']);
const pn=id=>(S.players.find(p=>p.id===id)||{name:'(削除済)'}).name;
const fmt=x=>x.toFixed(3).replace(/^0/,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function join(t){unsubs.forEach(u=>u());S.team=t;LS.team=t;S.meta=[];S.players=[];S.games=[];S.pas=[];S.runs=[];S.pitch=[];S.events=[];S.att=[];S.got={};
 unsubs=['meta','players','games','pas','runs','pitch','events','att'].map(c=>sub(t,c,a=>{S[c]=a;S.got[c]=true;if(c==='players')linkMe();draw()}));draw()}
function linkMe(){if(!cloud||!S.me||!S.me.no||S.me.playerId||!S.uid)return;const p=S.players.find(x=>String(x.no)===String(S.me.no));if(!p)return;
 const key=p.id+':'+(S.me.adminCode||'');if(S.linkFail===key)return;
 const nm={...S.me,playerId:p.id};col(S.team,'members').doc(S.uid).set(nm).then(()=>{S.me=nm;S.linkFail='';draw()}).catch(()=>{S.linkFail=key;draw()})}

/* ---- スコア(未入力=null)と自動加算 ---- */
const ent=v=>v!=null&&v!=='';
const nrm=a=>Array.from({length:9},(_,i)=>a&&ent(a[i])?+a[i]:null);
const au9=g=>Array.from({length:9},(_,i)=>!!(g.auto&&g.auto[i]));
const maxInn=g=>{let m=0;nrm(g.sc&&g.sc.us).forEach((v,i)=>{if(v!=null)m=i+1});return m};
const outsIn=(g,inn,ex)=>S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).reduce((a,p)=>a+outN(p.r),0)+S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&(r.k==='盗塁死'||r.k==='走塁死')).length;
const maxThem=g=>{let m=0;nrm(g.sc&&g.sc.them).forEach((v,i)=>{if(v!=null)m=i+1});return m};
const at9=g=>Array.from({length:9},(_,i)=>!!(g.autoT&&g.autoT[i]));
const pOuts=(g,inn,ex)=>sum(S.pitch.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.o));
const pRuns=(g,inn,ex)=>sum(S.pitch.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.r));
function autoThem(g,inn,list){const th=nrm(g.sc&&g.sc.them),us=nrm(g.sc&&g.sc.us),at=at9(g),i=inn-1;
 if(!(ent(th[i])&&!at[i])){const s=sum(list.filter(p=>+p.inn===+inn).map(p=>p.r));if(s>0){th[i]=s;at[i]=true}else if(at[i]){th[i]=null;at[i]=false}}
 return{...g,sc:{us,them:th},autoT:at}}
const pst=a=>{const o={o:0,h:0,hr:0,bb:0,hbp:0,so:0,r:0,er:0};a.forEach(x=>{for(const k in o)o[k]+=+x[k]||0});return o};
const ipS=o=>{const i=Math.floor(o/3),r=o%3;return r?(i?i+' ':'')+r+'/3':String(i)};
function onBase(g,inn,o){o=o||{};const c={},tb=o.tb==null?Infinity:o.tb;
 S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&REACH.includes(p.r)&&p.id!==o.ex&&p.t<tb).forEach(p=>{c[p.pid]=(c[p.pid]||0)+1});
 S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&['得点','盗塁死','走塁死','併殺走者'].includes(r.k)&&r.pa!==o.ex&&r.t<tb).forEach(r=>{c[r.pid]=(c[r.pid]||0)-1});
 return c}
const runsIn=(g,inn)=>S.runs.filter(r=>r.gid===g.id&&+r.inn===+inn&&r.k==='得点').length;
const rbiIn=(g,inn,ex)=>sum(S.pas.filter(p=>p.gid===g.id&&+p.inn===+inn&&p.id!==ex).map(p=>p.rbi));
function autoApply(g,inn,pas,runs){const us=nrm(g.sc&&g.sc.us),th=nrm(g.sc&&g.sc.them),au=au9(g),i=inn-1;
 if(!(ent(us[i])&&!au[i])){const s=Math.max(sum(pas.filter(p=>+p.inn===+inn).map(p=>p.rbi)),(runs||[]).filter(r=>r.k==='得点'&&+r.inn===+inn).length);
  if(s>0){us[i]=s;au[i]=true}else if(au[i]){us[i]=null;au[i]=false}}
 return{...g,sc:{us,them:th},auto:au}}

/* ---- 打順スロット(代打・守備交代・DP/FP) ---- */
const subsOf=p=>[...(p.sub||'')].filter(c=>FPOS.includes(c));
const slotsOf=g=>g.slots||(g.lineup||[]).map((id,i)=>{const o=(g.pos||{})[id]||'';return{id:'s'+i,pid:id,pos:o==='DH'?'DP':o==='EP'?'':o,fp:'',fpPos:'',log:[]}});
const cp=L=>L.map(s=>({...s,log:[...(s.log||[])]}));
const saveSlots=(g,slots)=>{const{lineup,pos,...r}=g;return put('games',{...r,slots})};
const slotPids=s=>[...new Set([(s.log&&s.log.length)?s.log[0].from:s.pid,...(s.log||[]).map(l=>l.to)])];
function autoPos(p,L){const tk=new Set();L.forEach(s=>{if(s.pos)tk.add(s.pos);if(s.fpPos)tk.add(s.fpPos)});
 return[p.pos,...subsOf(p)].filter(Boolean).find(x=>!tk.has(x))||''}
function prevIds(g){let o=S.games.filter(x=>x.id!==g.id&&slotsOf(x).length);
 const b=o.filter(x=>(x.date||'')<=(g.date||''));if(b.length)o=b;
 o.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!o.length)return[];
 return slotsOf(o[0]).flatMap(s=>[slotPids(s)[0],s.fp].filter(Boolean))}

const lab=p=>{const r=p.r,d=p.d||'',k=KS[p.k]||'';
 if(r==='四')return'四球';if(r==='死')return'死球';if(r==='振')return'三振';if(r==='振逃')return'振逃';if(r==='野選')return d+'野選';if(r==='併殺')return d+(KS[p.k]||'')+'併';
 if(r==='単')return d+'安';if(r==='二')return d+'二';if(r==='三')return d+'三';if(r==='本')return d+'本';
 if(r==='失')return d+k+'失';if(r==='犠打')return d+'犠打';if(r==='犠飛')return d+'犠飛';if(r==='進')return d+k+'進';return d+k};
const isHit=r=>'単二三本'.includes(r)&&r.length===1;
function st(ps){const o={pa:ps.length,ab:0,h:0,b:0,hr:0,bb:0,hbp:0,sf:0,rbi:0,so:0,gdp:0};
 for(const p of ps){o.rbi+=+p.rbi||0;const r=p.r;
  if(r==='四')o.bb++;else if(r==='死')o.hbp++;else if(r==='犠打');else if(r==='犠飛')o.sf++;
  else{o.ab++;if(isHit(r)){o.h++;o.b+={単:1,二:2,三:3,本:4}[r];if(r==='本')o.hr++}}
  if(r==='振'||r==='振逃')o.so++;if(r==='併殺')o.gdp++}
 o.avg=o.ab?o.h/o.ab:0;const d=o.ab+o.bb+o.hbp+o.sf;o.obp=d?(o.h+o.bb+o.hbp)/d:0;o.slg=o.ab?o.b/o.ab:0;o.ops=o.obp+o.slg;return o}

function loginV(){const nw=S.lmode==='new'&&cloud;
 return`<div class="card"><h2 style="margin-top:0">${nw?'チームを新規追加':'チームに参加'}</h2>${S.msg?`<p class="note" style="color:#a33">${esc(S.msg)}</p>`:''}
<p class="note">${nw?'新しいチームを作ります。チームIDと合言葉は、メンバーに伝えるものです。「チーム作成コード」は、管理者から指示があった場合だけ入力します(通常は空欄)。':'チームID・合言葉・背番号を入力します。この端末では最初の1回だけです(初回はインターネットに接続してください)。'}${cloud?'':'<br><b>※現在は共有設定前のため、この端末内だけに保存されます。</b>'}</p>
${nw?'<div class="row"><input id="tnm2" placeholder="チーム名"></div><div class="row" style="margin-top:8px"><select id="tsp2"><option value="soft">ソフトボール</option><option value="base">野球</option></select><select id="tinn2"><option value="7">7回制</option><option value="9">9回制</option><option value="6">6回制</option><option value="5">5回制</option></select></div>':''}
<div class="row" style="margin-top:${nw?8:0}px"><input id="tin" placeholder="${nw?'チームID(英小文字・数字・ハイフン 3〜30字)':'チームID'}" autocapitalize="off" value="${nw?'':esc(LS.team||'')}"></div>
${cloud?`<div class="row" style="margin-top:8px"><input id="tcode" type="password" placeholder="${nw?'合言葉(6文字以上・新しく決める)':'合言葉'}" autocapitalize="off"></div>${nw?'<div class="row" style="margin-top:8px"><input id="tcc" type="password" placeholder="チーム作成コード(通常は空欄)" autocapitalize="off"></div>':''}${nw?'<div class="row" style="margin-top:8px"><input id="tadm2" type="password" placeholder="管理者用の合言葉(6文字以上・新しく決める)" autocapitalize="off"></div>':''}<div class="row" style="margin-top:8px"><input id="tno" placeholder="${nw?'あなたの背番号(ない場合は空欄)':'背番号(ない場合は空欄)'}" inputmode="numeric"></div>${nw?'':'<div class="row" style="margin-top:8px"><input id="tadm" type="password" placeholder="管理者用の合言葉(管理者の方のみ)" autocapitalize="off"></div>'}`:''}
<button class="b" style="margin-top:8px;width:100%" data-a="${nw?'mkteam':'join'}">${nw?'チームを作成して参加':'参加する'}</button>
